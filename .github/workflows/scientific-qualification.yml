name: aegis-independent-scientific-qualification

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: scientific-qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-physics-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install real QEC engines
        run: python -m pip install ".[full]" h5py
      - name: Independent 1.2-million-shot seeded QEC verification and HDF5 recovery
        run: >-
          python scripts/scientific_qualification.py
          --shots-per-point 50000
          --dataset-shots 60000
          --out qualification_out/scientific.json
      - name: Preserve numerical evidence including on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scientific-qualification-${{ github.run_id }}
          path: qualification_out/
          if-no-files-found: error
          retention-days: 30

  coverage-and-adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ".[full,gui]" pytest pytest-cov ruff
      - name: Strict scientific source lint
        run: python -m ruff check --select F,B aegis_qec scripts/scientific_qualification.py tests/
      - name: Execute complete Python suite and capture branch coverage
        run: >-
          python -m pytest -q
          --cov=aegis_qec --cov=a3d --cov-branch
          --cov-report=term
          --cov-report=json:qualification_out/coverage.json
      - name: Preserve coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scientific-coverage-${{ github.run_id }}
          path: qualification_out/coverage.json
          if-no-files-found: warn
          retention-days: 30
